# Q-FLEX (UFPel), personal account. CPU only; shares the machine with other jobs (fallback server).
# Concurrency can be changed live in outputs/campaigns/<id>/control.yaml (max_workers, pause).
dataset:
  zip_path: ${HOME}/mimic-iv-benchmark/data/zip/mimic-iv-ed-2.2.zip
  extract_dir: ${HOME}/mimic-iv-benchmark/data/extracted
resources:
  max_workers: 22           # 32 threads; load guard below keeps 4 free for other users
  threads_per_worker: 1
  reserve_cpus: 4
  min_free_ram_gb: 16
  min_free_disk_gb: 20
  max_cpu_temp_c: 90
  nice: 10
paths:
  outputs: ${HOME}/mimic-iv-benchmark/outputs
  reports: ${HOME}/mimic-iv-benchmark/reports
