# Q-FLEX (UFPel), account etbuss. CPU only; shares the machine with other jobs.
# Concurrency can be changed live in outputs/campaigns/<id>/control.yaml (max_workers, pause).
dataset:
  zip_path: /home/etbuss/ed-triage/data/zip/mimic-iv-ed-2.2.zip
  extract_dir: /home/etbuss/ed-triage/data/extracted
resources:
  max_workers: 8
  threads_per_worker: 1
  reserve_cpus: 4
  min_free_ram_gb: 16
  max_cpu_temp_c: 90
  nice: 10
paths:
  outputs: /home/etbuss/ed-triage/outputs
  reports: /home/etbuss/ed-triage/reports
