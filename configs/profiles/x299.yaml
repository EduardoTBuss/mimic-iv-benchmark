# x299 (primary server since 05/11). Known to crash under sustained CPU load (95 C, see Brain wiki/servidor-x299.md).
# Few workers + thermal guard: no new task is launched while any CPU sensor is above the limit.
dataset:
  zip_path: ${HOME}/mimic-iv-benchmark/data/zip/mimic-iv-ed-2.2.zip
  extract_dir: ${HOME}/mimic-iv-benchmark/data/extracted
resources:
  max_workers: 4
  threads_per_worker: 1
  reserve_cpus: 6
  min_free_ram_gb: 6
  min_free_disk_gb: 5        # /home was 95% full on 05/11
  max_concurrent_per_model: {rf: 1, extratrees: 1}   # 31 GB RAM
  max_cpu_temp_c: 78
  nice: 15
paths:
  outputs: ${HOME}/mimic-iv-benchmark/outputs
  reports: ${HOME}/mimic-iv-benchmark/reports
