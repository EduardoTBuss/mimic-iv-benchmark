[project]
name = "triagebench"
version = "0.1.0"
description = "Reproducible benchmark of tabular ML models for emergency-department triage acuity prediction (MIMIC-IV-ED v2.2, triage vital signs)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eduardo Timm Buss" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "imbalanced-learn==0.14.2",
    "xgboost-cpu==3.4.1",
    "statsmodels==0.15.0",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "psutil==7.2.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "hypothesis==6.170.14", "ruff==0.17.3"]

[project.scripts]
triagebench = "triagebench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests on synthetic data"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
